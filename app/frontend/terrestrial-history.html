<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsão atual / histórico terrestre</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <h1>Evolução das Previsões Terrestres</h1>

    <div class="top-menu">
        <a href="index.html">Mapa aberto</a>
        <a href="history.html">Observação atual / Histórico</a>
        <a href="marine-history.html">Previsão atual / Histórico Maritimo</a>
        <a class="active" href="terrestrial-history.html">Previsão atual / histórico terrestre</a>
    </div>

    <div id="map"></div>

    <div class="container">
        <div class="coords" id="historyLocation">
            Nenhuma localização selecionada no mapa.
        </div>

        <div class="controls">
            <input type="date" id="histStartDate" />
            <input type="date" id="histEndDate" />

            <select id="histSource">
                <option value="">Todas as fontes</option>
                <option value="openweather">OpenWeather</option>
                <option value="open-meteo">Open-Meteo</option>
                <option value="ipma">IPMA</option>
            </select>

            <button onclick="carregarHistorico()">Pesquisar</button>
        </div>

        <div id="historico">
            Seleciona um ponto azul para ver a evolução das previsões terrestres.
        </div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="js/config.js"></script>
    <script src="js/map-common.js"></script>
    <script src="js/terrestrial-history.js"></script>
</body>
</html>
