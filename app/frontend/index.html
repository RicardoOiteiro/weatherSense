<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste API Meteorológica</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin: 16px;
        }

        #map {
            height: 500px;
            width: 100%;
        }

        .container {
            padding: 16px;
        }

        .controls {
            margin: 12px 0;
        }

        .coords {
            margin: 12px 0;
            font-weight: bold;
        }

        pre {
            background: #f4f4f4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        label {
            margin-right: 16px;
        }

        button {
            margin-right: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Mapa de Portugal - Teste da API</h1>

    <div id="map"></div>

    <div class="container">
        <div class="controls">
            <label>
                <input type="radio" name="modo" value="observation" checked />
                Observação
            </label>
            <label>
                <input type="radio" name="modo" value="marine" />
                Previsão - Marítimo
            </label>
            <label>
                <input type="radio" name="modo" value="terrestrial" />
                Previsão - Terrestre
            </label>
        </div>

        <div class="coords" id="coords">Clica no mapa para obter coordenadas</div>

        <div id="fontesContainer" class="controls"></div>

        <pre id="output">Sem dados ainda...</pre>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Tiles © Esri'
            }
        );

        const labels = L.tileLayer(
            'https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
            {
                attribution: 'Labels © Esri',
                interactive: false
            }
        );

        const map = L.map('map', {
            center: [39.5, -8.0],
            zoom: 7,
            layers: [satellite, labels]
        });

        // AQUI
        let leiriaBounds = null;

        fetch('/frontend/leiria.geojson')
            .then(response => response.json())
            .then(leiriaGeoJson => {
                const leiriaLayer = L.geoJSON(leiriaGeoJson, {
                    style: {
                        color: 'blue',
                        weight: 3,
                        fillOpacity: 0.05
                    }
                }).addTo(map);

                leiriaBounds = leiriaLayer.getBounds();
                map.fitBounds(leiriaBounds);
            });

        let marker = null;

        function obterModoSelecionado() {
            return document.querySelector('input[name="modo"]:checked').value;
        }

        function criarBotoesFontes(data, modo) {
            const container = document.getElementById('fontesContainer');
            const output = document.getElementById('output');

            container.innerHTML = '';

            for (const fonte in data) {
                if (fonte === 'requested_location') continue;

                const button = document.createElement('button');
                button.textContent = fonte.toUpperCase();

                button.onclick = function () {
                    if (modo === 'terrestrial' && fonte === 'openmeteo') {
                        criarBotoesModelos(fonte, data[fonte], data);
                        return;
                    }

                    output.textContent = JSON.stringify({
                        requested_location: data.requested_location,
                        [fonte]: data[fonte]
                    }, null, 2);
                };

                container.appendChild(button);
            }
        }

        function criarBotoesModelos(nomeFonte, fonteData, dataCompleta) {
            const container = document.getElementById('fontesContainer');
            const output = document.getElementById('output');

            container.innerHTML = '';

            const voltar = document.createElement('button');
            voltar.textContent = '← Voltar às fontes';
            voltar.onclick = function () {
                criarBotoesFontes(dataCompleta, 'terrestrial');
                output.textContent = 'Escolhe uma fonte acima.';
            };
            container.appendChild(voltar);

            for (const modelo in fonteData) {
                const button = document.createElement('button');
                const modeloData = fonteData[modelo];

                button.textContent = modeloData?.meta?.model || modelo;

                button.onclick = function () {
                    output.textContent = JSON.stringify({
                        requested_location: dataCompleta.requested_location,
                        [nomeFonte]: {
                            [modelo]: modeloData
                        }
                    }, null, 2);
                };

                container.appendChild(button);
            }

            output.textContent = `Escolhe um modelo da fonte ${nomeFonte.toUpperCase()}.`;
        }

        map.on('click', async function (e) {
            if (leiriaBounds && !leiriaBounds.contains(e.latlng)) {
                document.getElementById('output').textContent =
                    'Só são permitidas localizações dentro da área definida para o projecto.';
                return;
            }

            const lat = e.latlng.lat.toFixed(6);
            const lon = e.latlng.lng.toFixed(6);
            const modo = obterModoSelecionado();

            document.getElementById('coords').textContent =
                `Latitude: ${lat} | Longitude: ${lon}`;

            if (marker) {
                map.removeLayer(marker);
            }

            marker = L.marker([lat, lon]).addTo(map);

            const output = document.getElementById('output');
            const fontesContainer = document.getElementById('fontesContainer');

            output.textContent = 'A obter dados...';
            fontesContainer.innerHTML = '';

            let endpoint = '';

            if (modo === 'observation') {
                endpoint = `http://127.0.0.1:8000/weather/observation?lat=${lat}&lon=${lon}`;
            } else if (modo === 'marine') {
                endpoint = `http://127.0.0.1:8000/weather/marine?lat=${lat}&lon=${lon}`;
            } else if (modo === 'terrestrial') {
                endpoint = `http://127.0.0.1:8000/weather/terrestrial?lat=${lat}&lon=${lon}`;
            }

            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                if (!response.ok) {
                    output.textContent = `Erro da API: ${data.detail || JSON.stringify(data, null, 2)}`;
                    return;
                }

                if (modo === 'observation') {
                    fontesContainer.innerHTML = '';
                    output.textContent = JSON.stringify(data, null, 2);
                    return;
                }

                criarBotoesFontes(data, modo);
                output.textContent = 'Escolhe uma fonte acima.';

            } catch (error) {
                output.textContent = 'Erro ao obter dados da API: ' + error;
            }
        });
    </script>
</body>

</html>
