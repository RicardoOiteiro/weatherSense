<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa / APIs Meteorológicas</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <h1>Mapa de Portugal - Teste da API</h1>

    <div class="top-menu">
        <a class="active" href="index.html">Mapa / APIs</a>
        <a href="history.html">Histórico BD</a>
    </div>

    <div id="map"></div>

    <div class="container">
        <div class="controls">
            <label>
                <input type="radio" name="modo" value="observation" checked />
                Observação
            </label>

            <label>
                <input type="radio" name="modo" value="marine" />
                Previsão - Marítimo
            </label>

            <label>
                <input type="radio" name="modo" value="terrestrial" />
                Previsão - Terrestre
            </label>
        </div>

        <div class="coords" id="coords">
            Clica no mapa para obter coordenadas
        </div>

        <div id="fontesContainer" class="controls"></div>

        <pre id="output">Sem dados ainda...</pre>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script src="js/config.js"></script>
    <script src="js/map-common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script>
</body>

</html>
